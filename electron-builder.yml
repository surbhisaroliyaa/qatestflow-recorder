appId: com.qatestflow.recorder
productName: QATestFlow Recorder
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{FEATURES.md,CAPABILITIES.md,SECURITY.md,RELEASING.md,QA-Platform-PRD.md}'
  - '!tools/*'
  - '!build/icon.svg'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # The headless / parallel / cross-browser runners SHELL OUT to Playwright's
  # cli.js as a child process. A path inside app.asar is not a real file on
  # disk, so it can neither be spawned nor used as a module-resolution root.
  # Unpacking puts it in resources/app.asar.unpacked, where both work.
  # (playwright + playwright-core arrive as dependencies of @playwright/test.)
  - node_modules/@playwright/**
  - node_modules/playwright/**
  - node_modules/playwright-core/**
# Icons: build/icon.{ico,icns,png} are generated from build/icon.svg by
# `node tools/make-icons.mjs` — edit the SVG, then regenerate. (QF-010: the
# audit found Electron's default atom logo shipping here.)
win:
  executableName: QATestFlow Recorder
  # Code signing (QF-010): electron-builder signs automatically when these
  # environment variables are set at build time — nothing to change here:
  #   CSC_LINK          path or base64 of the .pfx code-signing certificate
  #   CSC_KEY_PASSWORD  its password
  # Unsigned builds still work; Windows shows "Unknown publisher" on install.
  # See RELEASING.md.
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Surbhi Saroliya
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Auto-update is OFF (QF-010). This used to point at the scaffold's placeholder
# https://example.com/auto-updates — a real installer would have asked a
# server nobody controls for updates. The app contains no updater code, so
# null means no update feed is generated at all. Switch on deliberately, with
# a real release channel (e.g. GitHub Releases), when there is one.
publish: null
