<!doctype html>
<!-- QF-004: `lang` is one of the two SERIOUS axe violations the audit found in
     the app's own shell. Without it a screen reader announces the entire
     interface using the user's default voice and pronunciation rules, which for
     a non-English default makes the UI read as gibberish. One attribute. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QATestFlow Recorder</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
