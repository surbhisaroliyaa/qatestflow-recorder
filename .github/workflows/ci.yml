# =====================================================================
#  QATestFlow Recorder — CI
# =====================================================================
#  Added in response to the independent QA audit (25 Aug 2026), whose fix
#  for the release blocker QF-001 was not only "correct the checkbox" but:
#
#      "Execute both inline and Page Object export for every HTML input
#       type in CI."
#
#  That is the `export-contract` job below, and it is the most important
#  job in this file. Everything else here checks that the code is sane;
#  that one checks the promise the product actually makes — that a test
#  you record and export RUNS somewhere else. The app replaying a step
#  green while the exported spec cannot run at all is the single failure
#  mode that makes this product worthless, and it is invisible to every
#  other kind of test, because the generated file is perfectly valid
#  TypeScript. It is just wrong.
# =====================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Does it compile, and do the fast checks pass? ──────────────────
  build:
    name: Typecheck, build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` would also run the electron-builder postinstall, which needs
      # native toolchains we don't have here and don't need to typecheck.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # QF-011: the test counts in README/FEATURES are generated; a stale doc fails.
      - name: Docs state the real test counts
        run: node tools/doc-counts.mjs --check
      - run: npm run build
      # QF-002: both windows are sandboxed; a preload that requires anything but
      # `electron` would crash at startup.
      - name: Preloads are sandbox-safe
        run: node tools/check-preload-sandbox.mjs

  # ── THE EXPORT CONTRACT (QF-001) ───────────────────────────────────
  # Generates a spec for every HTML form control with the REAL exporters,
  # inline AND page-object, then runs them with a REAL `npx playwright
  # test` and requires green. See test-dom/exported-spec.spec.ts.
  export-contract:
    name: Export contract — generated specs must actually run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Exported specs run green in real Playwright
        run: npm run test:export

  # ── The rest of the real-DOM suite ─────────────────────────────────
  # The replay engine builds JavaScript that it injects into a page, so it
  # can only be judged by executing it in a real browser.
  dom:
    name: Real-DOM tests (observer, replay, selectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # The app-shell accessibility scan (QF-004) loads the BUILT renderer.
      - run: npm run build
      - run: npm run test:dom

  # ── Dependency audit — BLOCKING (QF-006 closed 2026-09-18) ─────────
  # ALL dependencies, not `--omit=dev`. In an Electron app, `electron` is a
  # devDependency yet it is the runtime that ships inside the installer —
  # so `--omit=dev` (what this gate used to run) could never see the very
  # advisories QF-006 was about. High and critical fail the build; the one
  # remaining LOW (esbuild inside vite, dev server on Windows only) doesn't.
  audit:
    name: Dependency audit (high and above)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  # QF-009: lint is a real gate now — zero errors, zero warnings, and any new
  # warning fails the build (--max-warnings 0). Formatting is checked on its
  # own by prettier, so style noise can never bury a real finding again.
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint -- --max-warnings 0
      - run: npm run format:check
